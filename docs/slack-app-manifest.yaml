# A Slack app for one Rundesk agent, in one paste.
#
# Create New App -> From an app manifest -> YAML -> paste this -> Create.
#
# Change two things before you paste it, and read the comment on `command` before you
# change nothing else:
#
#   1. `display_information.name` and `bot_user.display_name` — what the agent is called.
#   2. `slash_commands[0].command` — see below. One agent per workspace can keep `/rundesk`.
#
# Everything else is what the adapter at `src/channels/slack` needs to work, and taking any
# of it out has a visible consequence named beside it.
#
# The full walk-through, including where the two tokens come from, is in `docs/slack.md`.

display_information:
  name: Rundesk
  description: A Rundesk agent, reachable here.
  background_color: "#1f2933"

features:
  bot_user:
    display_name: rundesk
    # **False on purpose.** A bot marked always online says an agent is up when the process
    # behind it has gone. Left false, the green dot follows the Socket Mode connection,
    # which is exactly as long as the agent's gateway is running (R-SLK-16).
    always_online: false

  app_home:
    # Without both of these nobody can send the bot a direct message, and the
    # `slack-dms` channel is deaf with nothing to say why.
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

  slash_commands:
    # **One command, and the gesture is its first word.** Slack allows one app per command
    # name in a workspace and the last app to register a name wins it — so an app claiming
    # `/stop` would take it from every other app, and two Rundesk agents could not both be
    # reached. Rename this per agent (`/winston`, `/ava`) when you run more than one, and
    # tell the adapter with `-- --command winston`.
    - command: /rundesk
      description: Steer this Rundesk agent, or ask it about itself
      usage_hint: stop | new | restart | status | version | agents | skills | schedules | roles | help | provider <name>
      should_escape: false

oauth_config:
  scopes:
    bot:
      # Being named in a channel.
      - app_mentions:read
      # Answering anywhere at all.
      - chat:write
      # Reading messages in the channels and private channels it has been invited to, and
      # reading a thread to know whether it has already answered in one.
      - channels:history
      - groups:history
      # Naming a channel an owner wrote as `#operations`, and checking at `--check` time
      # that the bot is really in the channel it was pointed at.
      - channels:read
      - groups:read
      # Direct messages, both ways. `im:write` is what opens a conversation with the owner
      # to say the gateway came up.
      - im:history
      - im:read
      - im:write
      # 👀 while a turn runs, and ✅ / ✋ / ⚠️ when it ends. Slack has no typing indicator
      # for a bot, so these marks are the whole of what says a turn was heard.
      - reactions:write
      # Downloading what somebody attached, and uploading what the agent made.
      - files:read
      - files:write
      # Saying who spoke in the words Slack shows, rather than as an id the brain cannot
      # read.
      - users:read

settings:
  event_subscriptions:
    bot_events:
      # `app_mention` is subscribed to because Slack expects an app that is mentionable to
      # have it, and is *deliberately ignored* by the adapter: a mention in a channel
      # arrives on both this and `message.channels`, and taking both would run every turn
      # twice.
      - app_mention
      - message.im
      - message.channels
      - message.groups

  interactivity:
    # What carries slash-command payloads over the socket. Without it the command exists
    # and nothing ever receives it.
    is_enabled: true

  # No public request URL, no inbound firewall hole: the app opens the connection.
  socket_mode_enabled: true
  token_rotation_enabled: false
