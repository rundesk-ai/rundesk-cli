name: Feature
description: Propose a capability that must be built into Rundesk itself.
title: "<area>: "
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed issues first. A custom skill, script, adapter, integration, or existing tool is owner customization rather than a Rundesk feature. Remove private or identifying data from all evidence.
  - type: textarea
    id: need
    attributes:
      label: Need
      description: Who needs what, and what is impossible or costly today?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Give a concrete example, request, measurement, or current limitation.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Define the bounded capability or outcome Rundesk must provide.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Name the nearest tempting expansion that this issue does not include.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable completion conditions without prescribing implementation.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Possible approach
      description: Optional implementation ideas; the issue must remain valid if the design changes.
    validations:
      required: false
  - type: input
    id: identity
    attributes:
      label: Filing identity
      description: Use the filing agent's display name and no provider, model, tool, or session branding.
      placeholder: "🤖 by <Agent>"
    validations:
      required: true
