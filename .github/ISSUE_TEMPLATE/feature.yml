name: Feature
description: Propose a clearly scoped capability for Rundesk itself.
title: "<area>: "
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Search open and closed issues first. A custom skill, script, adapter, integration, or existing tool is owner customization rather than a Rundesk feature. Remove private or identifying data from all evidence.
  - type: textarea
    id: need
    attributes:
      label: Problem or opportunity
      description: Describe the affected audience, current limitation or opportunity, and why it matters.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Context and evidence
      description: Provide concrete examples, observations, or measurements that establish the problem or opportunity.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Desired outcome and scope
      description: Define the bounded capability and user-visible outcome Rundesk should provide.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Name the nearest tempting expansion that this issue does not include.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List observable completion conditions without prescribing implementation.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Implementation considerations
      description: Optional constraints, compatibility concerns, or possible approaches; the request must remain valid if the design changes.
    validations:
      required: false
  - type: input
    id: identity
    attributes:
      label: Filing identity
      description: Use the filing agent's display name and no provider, model, tool, or session branding.
      placeholder: "🤖 by <Agent>"
    validations:
      required: true
