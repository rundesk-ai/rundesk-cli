name: bisect

# Temporary. Finds which case in a suite hangs on Linux, by running every class on its own
# under a bound. A suite that hangs as a whole says nothing at all — the step never ends,
# so the runner never publishes its log — and three fixes have now been aimed at it by
# inference. This replaces inference with a list.
#
# Delete once the hang is found.

on:
  workflow_dispatch:
    inputs:
      suite:
        description: which suite to take apart
        default: tests/test_gateway.py
      seconds:
        description: how long one class may take before it is called stuck
        default: '120'
      classes:
        description: only these classes, space separated; empty means every one
        default: ''

jobs:
  class-by-class:
    name: ${{ inputs.suite }} — class by class on ${{ matrix.os }}
    timeout-minutes: 45
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: This checkout has an install beside it, as a developer's does
        run: mkdir -p .venv/lib/python3.13

      - name: Every class, on its own, with a bound
        shell: bash
        run: |
          # No -e. The runner sets it by default, and a class that fails then aborts the
          # whole script before the next one runs — which is how the first attempt exited
          # silently at class one and told us nothing.
          set +e
          suite="${{ inputs.suite }}"
          seconds="${{ inputs.seconds }}"
          classes="${{ inputs.classes }}"
          [ -n "$classes" ] || classes=$(sed -n 's/^class \([A-Za-z_][A-Za-z0-9_]*\).*/\1/p' "$suite")
          stuck=""
          for one in $classes; do
            # Said before it runs, not after: if this harness dies, the last line printed
            # is still the class it died on.
            echo "::notice title=running::$one"
            python -u "$suite" "$one" > one.log 2>&1 &
            ran=$!
            waited=0
            while kill -0 "$ran" 2>/dev/null && [ "$waited" -lt "$seconds" ]; do
              sleep 1
              waited=$((waited + 1))
            done
            if kill -0 "$ran" 2>/dev/null; then
              echo "::error title=STUCK::$one hung for ${waited}s"
              stuck="$stuck $one"
              kill -9 "$ran" 2>/dev/null
            else
              wait "$ran"
              code=$?
              if [ "$code" -eq 0 ]; then echo "::notice title=ok::$one"; else echo "::error title=FAILED::$one exit=$code"; tail -5 one.log; fi
            fi
          done
          echo
          echo "STUCK CLASSES:${stuck:- none}"
