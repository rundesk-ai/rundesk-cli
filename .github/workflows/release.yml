name: release

# Push a vX.Y.Z tag → publish a GitHub Release and attach install.sh, so
#   https://github.com/rundesk-ai/rundesk-cli/releases/latest/download/install.sh
# always serves the installer that shipped with the newest release — and so
# `rundesk update` has something to find.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: The tag and the version in the code agree
        # A release tagged differently from what the command reports is a release
        # nobody can reason about: `rundesk version` would name one thing and the
        # update it offers another.
        run: |
          python - "$GITHUB_REF_NAME" <<'CHECK'
          import sys
          sys.path.insert(0, "src")
          from rundesk_cli import __version__, updater
          tag = sys.argv[1]
          print(f"tag={tag}  code={__version__}")
          if not updater.tag_matches(tag, __version__):
              print(f"::error::tag {tag} does not name the version the command reports ({__version__})")
              raise SystemExit(1)
          CHECK

      - uses: softprops/action-gh-release@v2
        with:
          files: install.sh
          generate_release_notes: true
