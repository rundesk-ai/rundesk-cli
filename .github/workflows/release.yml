name: release

# Push a vX.Y.Z tag → publish one program archive. Remote installs and updates
# both fetch this asset, so GitHub's cumulative release-download count records
# each delivery once (R-INS-20, R-UPD-49).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'

      - name: The tag and the version in the code agree
        # A release tagged differently from what the command reports is a release
        # nobody can reason about: `rundesk version` would name one thing and the
        # update it offers another.
        run: |
          python - "$GITHUB_REF_NAME" <<'CHECK'
          import sys
          sys.path.insert(0, "src")
          from rundesk import __version__, updater
          tag = sys.argv[1]
          print(f"tag={tag}  code={__version__}")
          if not updater.tag_matches(tag, __version__):
              print(f"::error::tag {tag} does not name the version the command reports ({__version__})")
              raise SystemExit(1)
          CHECK

      - name: Build the counted program archive
        run: |
          git archive --format=tar --prefix="rundesk-cli-${GITHUB_REF_NAME}/" "$GITHUB_SHA" |
            gzip -9 > rundesk-cli.tar.gz

      - uses: softprops/action-gh-release@v3
        with:
          files: rundesk-cli.tar.gz
          generate_release_notes: true
