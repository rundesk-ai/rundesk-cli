name: build

# One run per pull request. The product is being rebuilt part by part, so this file grows a job as
# each part lands rather than describing a build that is not there yet: today the knowledge system
# is what exists and what is checked. The suite job arrives with the first suite, and it fails on an
# empty discovery — the workflow this replaces globbed a directory that had moved, matched nothing
# and reported success.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  knowledge:
    name: the knowledge system
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: The docs meet the standard
        run: python3 .knowledge/scripts/doc-lint .knowledge

      - name: The linter still has its teeth
        # doc-lint passing proves nothing on its own — this drives a valid project through it and
        # then breaks one rule at a time, so a linter that has stopped checking is caught here.
        run: python3 .knowledge/scripts/test_doc_lint.py

  tests:
    name: the suites (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python a fresh macOS ships is the floor everything is written against, and a
        # current one catches what only a newer interpreter minds. Both systems, because an install
        # is a thing that happens to a machine.
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Everything parses
        run: |
          python3 - <<'PARSE'
          import ast, glob, sys
          found = glob.glob('src/**/*.py', recursive=True) + glob.glob('tests/*.py')
          if not found:
              print('::error::the parse check found no python at all')
              sys.exit(1)
          for path in found:
              ast.parse(open(path).read(), path)
          print(f'parse OK ({len(found)} files)')
          PARSE

      - name: The shell scripts parse
        run: bash -n dev

      - name: Every suite
        # The same script a developer runs. It finds the suites rather than listing them, and fails
        # when it finds none.
        run: python3 .knowledge/scripts/suites

  required-pr-gate:
    name: required
    runs-on: ubuntu-latest
    needs: [knowledge, tests]
    steps:
      - run: echo "every required job passed"
