name: build

# One run per pull request. The product is being rebuilt part by part, so this file describes what is
# actually here rather than what is planned: the suites, on both interpreters and both systems.
#
# It checked a `.knowledge/` documentation system until that system was removed in the rebuild, and
# went on calling three scripts that no longer existed — so every run was red for a reason that had
# nothing to do with the change being reviewed, and a red gate nobody can act on is a gate nobody
# reads. What runs here is what a developer runs: `python3 scripts/suites`.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: the suites (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest Python a fresh macOS ships is the floor everything is written against, and a
        # current one catches what only a newer interpreter minds. Both systems, because an install
        # is a thing that happens to a machine.
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Everything parses
        # `scripts/suites` and `rundesk` are named rather than globbed: they are Python without a
        # `.py` on them, so a pattern that only knows the extension would skip the two files every
        # other check here goes through.
        run: |
          python3 - <<'PARSE'
          import ast, glob, sys
          found = (glob.glob('src/**/*.py', recursive=True) + glob.glob('tests/*.py')
                   + ['scripts/suites', 'rundesk'])
          if not found:
              print('::error::the parse check found no python at all')
              sys.exit(1)
          for path in found:
              ast.parse(open(path).read(), path)
          print(f'parse OK ({len(found)} files)')
          PARSE

      - name: The shell scripts parse
        run: |
          bash -n dev
          bash -n install.sh

      - name: Every suite
        # The same script a developer runs. It finds the suites rather than listing them, and fails
        # when it finds none.
        run: python3 scripts/suites

  style:
    name: how the code is written
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: The conventions in ruff.toml are kept
        # Pinned, not floating. A linter that upgrades itself turns this red on a morning nobody
        # changed anything, and a gate that goes red for reasons unrelated to the change under
        # review is a gate people learn to scroll past — which is how the job this replaces came to
        # be pointed at a directory that had not existed for four commits.
        #
        # rundesk itself still declares no dependencies: this is fetched here, in CI, and nothing a
        # person installs ever sees it. `requirements.txt` stays empty on purpose.
        run: |
          pip install ruff==0.16.1
          ruff check src tests scripts/suites rundesk

  required-pr-gate:
    # **The name is the contract.** `main` is protected on a required context spelled
    # `required PR gate`, and a check run is matched by the name it publishes — so this job
    # answering to `required` meant the context nothing produced stayed pending for ever, and
    # every pull request was BLOCKED with six green checks above it. `enforce_admins` is on, so
    # there was nobody who could merge past it either. Renaming here rather than loosening the
    # protection: the gate is what the branch asks for, and it is this file that had it wrong.
    name: required PR gate
    runs-on: ubuntu-latest
    needs: [tests, style]
    steps:
      - run: echo "every required job passed"
